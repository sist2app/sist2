name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Keeps the vcpkg cache entry alive (GitHub evicts caches untouched for 7 days)
  schedule:
    - cron: "0 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + test (x64)
    runs-on: ubuntu-24.04
    # A cold vcpkg build (ffmpeg, mupdf, tesseract, openblas from source) is the worst case
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git curl zip unzip tar \
            autoconf autoconf-archive automake libtool libtool-bin nasm yasm bison flex gperf gettext \
            texinfo gfortran python3 zlib1g-dev tesseract-ocr-eng

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build sist2-vue
        run: cd sist2-vue && npm install && npm run build

      - name: Read vcpkg baseline
        id: vcpkg
        run: echo "baseline=$(jq -r .\"builtin-baseline\" vcpkg.json)" >> "$GITHUB_OUTPUT"

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.baseline }}-${{ hashFiles('vcpkg.json', 'overlay-ports/**') }}

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "${{ steps.vcpkg.outputs.baseline }}"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        # vcpkg gives up on a source tarball as soon as one download fails, so a
        # dropped connection kills a cold build. Ports built before the failure
        # come back from the binary cache, making a retry cheap.
        run: |
          for attempt in 1 2 3; do
            if cmake -B build -G Ninja \
                -DSIST_PLATFORM=x64_linux_ci \
                -DSIST_DEBUG=off \
                -DBUILD_TESTS=on \
                -DVCPKG_MANIFEST_FEATURES=tests \
                -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake"; then
              exit 0
            fi
            echo "::warning::configure failed (attempt $attempt/3)"
            sleep $((attempt * 30))
          done
          exit 1

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        env:
          TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
        run: ctest --test-dir build --output-on-failure -j "$(nproc)"

  windows:
    name: cross build (x64-windows)
    runs-on: ubuntu-24.04
    # A cold vcpkg build (ffmpeg, mupdf, tesseract, openblas from source) is the worst case
    timeout-minutes: 350
    env:
      DOCKER_BUILD_SUMMARY: false

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Compile-and-link check only: there is nothing here to execute a PE binary. The test
      # binaries do build for Windows and pass under wine, so this job could grow to run them;
      # the ASan and UBSan variants stay Linux-only, since mingw ships no sanitizer runtimes.
      - name: Build the Windows binary
        uses: docker/build-push-action@v6
        with:
          context: .
          target: artifact-windows
          outputs: type=local,dest=./dist-windows
          cache-from: type=gha,scope=mingw
          cache-to: type=gha,scope=mingw,mode=max

      - name: Check the binary is a PE executable
        run: file dist-windows/sist2.exe | grep -q "PE32+ executable"
