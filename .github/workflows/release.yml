name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the leading v). Images are pushed, no GitHub release is created."
        required: true

permissions:
  contents: write
  packages: write

env:
  DOCKERHUB_IMAGE: sist2app/sist2
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

# The binary and the image are built from different libcs (musl for the portable download, glibc
# for the image), so they share no dependency layers and get a job and a build cache each.
jobs:
  version:
    name: version check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The tag is what names every artifact, but src/sist.h is what the binary reports and
      # what the index compatibility check reads, so a tag that does not match it ships a
      # binary lying about its own version.
      - name: Tag matches src/sist.h
        env:
          REF: ${{ inputs.version || github.ref_name }}
        run: |
          tag_version="${REF#v}"
          # A pre-release tag (4.0.4-rc1) carries the version it is a candidate for
          tag_version="${tag_version%%-*}"
          source_version=$(sed -nE 's/^#define VERSION_(MAJOR|MINOR|PATCH) ([0-9]+)$/\2/p' src/sist.h | paste -sd. -)
          echo "tag: ${tag_version}, src/sist.h: ${source_version}"
          if [ "$tag_version" != "$source_version" ]; then
            echo "::error::src/sist.h is version ${source_version}, expected ${tag_version}" >&2
            exit 1
          fi

  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            target: artifact
            built: sist2
            asset: sist2-x64-linux-static
            cache: x64-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: artifact
            built: sist2
            asset: sist2-arm64-linux-static
            cache: arm64-musl
          # Cross-compiled with mingw-w64, so it runs on the same x64 linux runner as the others
          - arch: x64-windows
            runner: ubuntu-24.04
            target: artifact-windows
            built: sist2.exe
            asset: sist2-x64-windows.exe
            cache: x64-mingw
    name: static binary (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    # A cold vcpkg build (ffmpeg, mupdf, tesseract, openblas from source) is the worst case
    timeout-minutes: 350
    env:
      # buildx uploads a .dockerbuild summary artifact per step; nothing consumes them
      DOCKER_BUILD_SUMMARY: false

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build static binary
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          outputs: type=local,dest=./dist-static
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}-buildcache:${{ matrix.cache }}
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}-buildcache:${{ matrix.cache }},mode=max

      - name: Name the binary
        run: mv "dist-static/${{ matrix.built }}" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          # Re-running a failed job would otherwise leave two artifacts of the same name
          overwrite: true

  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: runtime image (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      DOCKER_BUILD_SUMMARY: false

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          REF: ${{ inputs.version || github.ref_name }}
        run: echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}-linux
            ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}-linux
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}-buildcache:${{ matrix.arch }}-glibc
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}-buildcache:${{ matrix.arch }}-glibc,mode=max

  #
  # Merges the two per-arch tags into a multi-arch manifest list, so that
  # sist2app/sist2:<version> resolves to the right image on both architectures.
  #
  manifest:
    name: multi-arch manifest
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve version
        id: version
        env:
          REF: ${{ inputs.version || github.ref_name }}
        run: echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest lists
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for image in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            args=(--tag "${image}:${VERSION}")

            # Pre-release versions (1.2.3-rc1, 1.2.3-beta) do not move :latest
            case "$VERSION" in
              *-*) ;;
              *) args+=(--tag "${image}:latest") ;;
            esac

            docker buildx imagetools create "${args[@]}" \
              "${image}:${VERSION}-x64-linux" \
              "${image}:${VERSION}-arm64-linux"
          done

  release:
    name: github release
    needs: binary
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve version
        id: version
        env:
          REF: ${{ github.ref_name }}
        run: echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: sist2-*
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum sist2-* > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/sist2-*
            artifacts/SHA256SUMS
          generate_release_notes: true
          body: |
            ```
            docker pull sist2app/sist2:${{ steps.version.outputs.version }}
            ```
